[pytest]
asyncio_mode = auto
# Explicit (silences a pytest-asyncio deprecation warning) and matches what
# auto-mode already does for every `async def test_...`: each test runs in
# its own function-scoped event loop. Fixtures follow their own pytest scope
# for loop purposes (see conftest.py's NullPool comment for why a
# session-scoped fixture is still safe to mix with function-scoped tests).
asyncio_default_fixture_loop_scope = function

version: "3.9"

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: swms
      POSTGRES_PASSWORD: swms
      POSTGRES_DB: swms
    ports:
      - "5432:5432"
    volumes:
      - swms_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swms"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # quay.io, not docker.io: MinIO stopped publishing new tags to Docker Hub,
  # so `minio/minio` there is stale/rate-limited. quay.io/minio/minio is
  # MinIO's own current registry.
  minio:
    image: quay.io/minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: swms_minio
      MINIO_ROOT_PASSWORD: swms_minio_secret
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # web console
    volumes:
      - swms_miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: postgresql+asyncpg://swms:swms@db:5432/swms
      JWT_SECRET: dev-only-secret-change-me
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 15
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      ENVIRONMENT: development
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: swms_minio
      MINIO_SECRET_KEY: swms_minio_secret
      MINIO_BUCKET: swms-uploads
      MINIO_SECURE: "false"
      # Module M15 (chat): optional. Leave blank/unset and the chatbot runs
      # entirely on its deterministic keyword matcher — see .env.example.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-haiku-4-5-20251001}
      # Automation module (auto-populate). All three are free public APIs —
      # these defaults work with no key. Override only for a commercial
      # tier or a self-hosted instance.
      OPEN_METEO_API_URL: ${OPEN_METEO_API_URL:-https://archive-api.open-meteo.com/v1/archive}
      OPEN_METEO_API_KEY: ${OPEN_METEO_API_KEY:-}
      OVERPASS_API_URL: ${OVERPASS_API_URL:-https://overpass-api.de/api/interpreter}
      OPEN_ELEVATION_API_URL: ${OPEN_ELEVATION_API_URL:-https://api.open-elevation.com/api/v1/lookup}
      GEOCODING_API_URL: ${GEOCODING_API_URL:-https://nominatim.openstreetmap.org/search}
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  # "ingest" queue: dataset uploads (M5), GIS layer loads (M4/BG-01), and
  # report generation (M14/BG-07) — all file-producing/consuming work.
  worker-ingest:
    build: .
    command: celery -A app.workers.celery_app worker --loglevel=info --queues=ingest --concurrency=2
    environment:
      DATABASE_URL: postgresql+asyncpg://swms:swms@db:5432/swms
      JWT_SECRET: dev-only-secret-change-me
      JWT_ALGORITHM: HS256
      ENVIRONMENT: development
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: swms_minio
      MINIO_SECRET_KEY: swms_minio_secret
      MINIO_BUCKET: swms-uploads
      MINIO_SECURE: "false"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  # "simulate" queue: BG-04, the 240-month engine run, and BG-06's
  # sensitivity fan-out (M10, each sweep point is itself a simulation run).
  # A separate queue and worker from "ingest" (design AD-18) so a
  # multi-second simulation never queues behind — or blocks — a file
  # upload, and vice versa.
  worker-simulate:
    build: .
    command: celery -A app.workers.celery_app worker --loglevel=info --queues=simulate --concurrency=2
    environment:
      DATABASE_URL: postgresql+asyncpg://swms:swms@db:5432/swms
      JWT_SECRET: dev-only-secret-change-me
      JWT_ALGORITHM: HS256
      ENVIRONMENT: development
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: swms_minio
      MINIO_SECRET_KEY: swms_minio_secret
      MINIO_BUCKET: swms-uploads
      MINIO_SECURE: "false"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  # "optimize" queue: BG-05 (M11), a several-hundred-evaluation search — its
  # own queue so it never delays a user's simulation or upload, and vice
  # versa (design AD-18).
  worker-optimize:
    build: .
    command: celery -A app.workers.celery_app worker --loglevel=info --queues=optimize --concurrency=1
    environment:
      DATABASE_URL: postgresql+asyncpg://swms:swms@db:5432/swms
      JWT_SECRET: dev-only-secret-change-me
      JWT_ALGORITHM: HS256
      ENVIRONMENT: development
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: swms_minio
      MINIO_SECRET_KEY: swms_minio_secret
      MINIO_BUCKET: swms-uploads
      MINIO_SECURE: "false"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  # Celery Beat: BG-08 (stuck-job janitor), BG-09 (expired-token cleanup),
  # BG-10 (overlay cache warmer) — see app/workers/beat.py.
  beat:
    build: .
    command: celery -A app.workers.celery_app beat --loglevel=info
    environment:
      DATABASE_URL: postgresql+asyncpg://swms:swms@db:5432/swms
      JWT_SECRET: dev-only-secret-change-me
      JWT_ALGORITHM: HS256
      ENVIRONMENT: development
      REDIS_URL: redis://redis:6379/0
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  swms_pgdata:
  swms_miniodata:
